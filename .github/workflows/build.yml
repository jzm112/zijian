name: Build ImmortalWrt ARM64

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发编译
  push:
    branches:
      - main
    paths:
      - '.config'   # 只要你修改并提交了 .config 文件，就会自动开始编译

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 ascii bash bc binutils bzip2 libbzip2-dev cgi-io coreutils curl device-tree-compiler diffutils docbook-xml docbook-xsl flex gawk gcc gcc-multilib gengetopt gettext git git-core gperf glib2.0-dev groff help2man htop ibverbs-providers iconv info install-info intltool jq lib32gcc-s1 lib32stdc++6 libacl1-dev libarchive-dev libattr1-dev libblkid-dev libboost-all-dev libcap-dev libcap-ng-dev libcurl4-openssl-dev libdrm-dev libelf-dev libglib2.0-dev libgmp-dev libgmpxx4ldbl libip4tc-dev libip6tc-dev libjson-c-dev libltdl-dev libmbedtls-dev libncurses5-dev libncursesw5-dev libnl-3-dev libnl-genl-3-dev libopenssl-dev libpcap-dev libpcre3-dev libpcre2-dev libreadline-dev libsqlite3-dev libssl-dev libstdc++6 libtool libudev-dev libusb-1.0-0-dev libuv1-dev libxml2-utils libz-dev linux-headers-generic lz4 lzma lzma-dev lzop make m4 ncftp ncurses-bin net-tools ninja-build patch perl pkgconf python3 python3-pip python3-ply python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig tar texinfo uglifyjs unzip u-boot-tools uuid-dev vim wget xmlto xz-utils zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 拉取 ImmortalWrt 源码与 Feeds
      run: |
        git clone -b openwrt-23.05 --single-branch https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 载入配置文件 (.config)
      run: |
        [ -e .config ] && rm .config
        cp $GITHUB_WORKSPACE/.config openwrt/.config
        cd openwrt
        make defconfig

    - name: 下载源码预处理包
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 开始编译固件
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s

    - name: 整理打包编译产物
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: 上传编译好的固件到 GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_ARM64_Firmware
        path: ${{ env.FIRMWARE_PATH }}/*
